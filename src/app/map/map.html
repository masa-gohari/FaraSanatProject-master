<section class="map-section container my-5">
  <div class="row g-4 align-items-stretch">
    <div class="col-12 col-lg-5">
      <div class="map-content h-100">
        <span class="map-badge">موقعیت ما</span>

        <h2 class="map-title">آدرس گروه صنعتی فراصنعت</h2>

        <p class="map-text">
          برای مشاهده دقیق موقعیت شرکت، می‌توانید از نقشه زیر استفاده کنید
          یا مستقیماً موقعیت را در اپلیکیشن و وب‌سایت نشان باز کنید.
        </p>

        <a
          class="open-map-btn"
          [href]="neshanLink"
          target="_blank"
          rel="noopener noreferrer"
        >
          باز کردن در نشان
        </a>
      </div>
    </div>

    <div class="col-12 col-lg-7">
      <div class="map-card">
        <div id="map"></div>
      </div>
    </div>
  </div>
</section>
